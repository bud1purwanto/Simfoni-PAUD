<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="simfoniGrad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="softShadow-192" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25" flood-color="#7C2D12"/>
    </filter>
  </defs>

  <!-- Background Squircle with Warm Honey Theme -->
  <rect width="192" height="192" rx="46" fill="url(#simfoniGrad-192)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="96" cy="96" r="64" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Beamed Music Note (Solid & Crisp for any resolution) -->
  <g fill="#ffffff" filter="url(#softShadow-192)" transform="scale(1)">
    <!-- Left Notehead (Tilted Oval) -->
    <ellipse cx="54" cy="132" rx="22" ry="16" transform="rotate(-18 54 132)"/>
    <!-- Right Notehead (Tilted Oval) -->
    <ellipse cx="128" cy="116" rx="22" ry="16" transform="rotate(-18 128 116)"/>
    <!-- Left Vertical Stem -->
    <rect x="68" y="52" width="10" height="80" rx="3"/>
    <!-- Right Vertical Stem -->
    <rect x="142" y="36" width="10" height="80" rx="3"/>
    <!-- Beamed Top Connecting Bar -->
    <path d="M68 52 L152 36 C153.5 36 155 37.5 155 39.5 L155 52 C155 53.5 153.5 54.5 152 55 L68 71 C66.5 71.5 65 70 65 68 L65 55.5 C65 53.5 66.5 52.3 68 52 Z"/>
    <!-- Secondary Beamed Bar (Simfoni Style) -->
    <path d="M68 76 L152 60 C153.5 60 155 61.5 155 63.5 L155 71 C155 72.5 153.5 73.5 152 74 L68 90 C66.5 90.5 65 89 65 87 L65 79.5 C65 77.5 66.5 76.3 68 76 Z"/>
  </g>

  <!-- Cute Sparkle Accent -->
  <circle cx="158" cy="34" r="4.5" fill="#FEF3C7"/>
</svg>